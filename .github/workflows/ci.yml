name: LaTeX CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-extra-utils texlive-latex-recommended texlive-lang-cyrillic texlive-lang-other

    - name: Compile LaTeX document
      run: |
        pdflatex -interaction=nonstopmode main.tex
        bibtex main.aux || true
        pdflatex -interaction=nonstopmode main.tex
        pdflatex -interaction=nonstopmode main.tex

    - name: Check for compilation errors
      run: |
        if [ ! -f "main.pdf" ]; then
          echo "PDF compilation failed"
          exit 1
        fi

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-pdf
        path: main.pdf
